[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-processor"
version = "0.1.0"
description = "FastAPI service for invoice document processing using Azure Document Intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "azure-ai-documentintelligence>=1.0.0b3",
    "azure-core>=1.30.1",
    "aiohttp>=3.14.4",
    "azure-storage-blob>=12.19.0",
    "pypdf>=4.1.0",
    "aiofiles>=23.2.1",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ui = [
    "streamlit[pdf]",
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=app"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "ui*"]
exclude = ["tests*", "storage_data*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
